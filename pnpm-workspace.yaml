allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: true
catalog:
  rolldown: "^1.1.3"
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1
  vite-plus: 0.2.1
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-*"
  - vite-plus
  - rolldown
  - "@rolldown/*"
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
